name: Build PastelCal APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 platform
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug and unsigned release APKs
        run: gradle --no-daemon :app:assembleDebug :app:assembleRelease

      - name: Rename APKs
        shell: bash
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk PastelCal-1.1.0-Frogs-debug.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk PastelCal-1.1.0-release-unsigned.apk

      - name: Package Android signing tool
        shell: bash
        run: |
          mkdir -p android-signing-tool/lib
          cp "$ANDROID_HOME/build-tools/36.0.0/apksigner" android-signing-tool/
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" android-signing-tool/lib/
          cp "$ANDROID_HOME/build-tools/36.0.0/zipalign" android-signing-tool/

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PastelCal-1.1.0-Frogs-debug
          path: PastelCal-1.1.0-Frogs-debug.apk
          retention-days: 7
          if-no-files-found: error

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: PastelCal-1.1.0-release-unsigned
          path: PastelCal-1.1.0-release-unsigned.apk
          retention-days: 7
          if-no-files-found: error

      - name: Upload Android signing tool
        uses: actions/upload-artifact@v4
        with:
          name: android-build-tools-36-signing
          path: android-signing-tool/
          retention-days: 1
          if-no-files-found: error
