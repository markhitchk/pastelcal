name: Build PastelCal APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Wire dedicated Period Tracker navigation
        shell: bash
        run: |
          python3 scripts/patch-period-tracker-nav.py
          if ! git diff --quiet -- app/src/main/java/com/pastelcal/app/MainActivity.kt; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add app/src/main/java/com/pastelcal/app/MainActivity.kt
            git commit -m 'Add Period Tracker tab and screen navigation'
            git push origin HEAD:main
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 platform
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build unsigned release APK first
        run: gradle --no-daemon :app:assembleRelease

      - name: Rename unsigned release APK
        run: cp app/build/outputs/apk/release/app-release-unsigned.apk PastelCal-1.1.0-release-unsigned.apk

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: PastelCal-1.1.0-release-unsigned
          path: PastelCal-1.1.0-release-unsigned.apk
          retention-days: 7
          if-no-files-found: error
