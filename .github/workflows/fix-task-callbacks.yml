name: Fix PastelCal task callbacks

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-task-callbacks.yml'

permissions:
  contents: write

jobs:
  fix-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fix task callback signatures
        shell: python
        run: |
          from pathlib import Path

          path = Path('app/src/main/java/com/pastelcal/app/MainActivity.kt')
          text = path.read_text()

          replacements = [
              (
                  'TaskRow(occurrence.display, onToggle = { onToggleTask(occurrence.source, occurrence.date) }, onOpen = { onOpen(occurrence.source) })',
                  'TaskRow(occurrence.display, onToggle = { onToggleTask(occurrence.source, occurrence.date) }, onOpen = { onOpen(occurrence.source, occurrence.date) })'
              ),
              (
                  '''AppTab.TASKS -> TasksScreen(\n                    tasks = allItems.filter { it.kind == ItemKind.TASK },\n                    completedOccurrences = completedOccurrences,\n                    onToggle = vm::toggleTaskOccurrence,\n                    onOpen = { editorTarget = EditorTarget(it, it.date); showEditor = true }\n                )''',
                  '''AppTab.TASKS -> TasksScreen(\n                    tasks = allItems.filter { it.kind == ItemKind.TASK },\n                    completedOccurrences = completedOccurrences,\n                    onToggle = vm::toggleTaskOccurrence,\n                    onOpen = { item, occurrenceDate -> editorTarget = EditorTarget(item, occurrenceDate); showEditor = true }\n                )'''
              ),
              (
                  '''private fun TasksScreen(\n    tasks: List<CalendarItem>,\n    completedOccurrences: Set<String>,\n    onToggle: (CalendarItem, LocalDate) -> Unit,\n    onOpen: (CalendarItem) -> Unit\n)''',
                  '''private fun TasksScreen(\n    tasks: List<CalendarItem>,\n    completedOccurrences: Set<String>,\n    onToggle: (CalendarItem, LocalDate) -> Unit,\n    onOpen: (CalendarItem, LocalDate) -> Unit\n)'''
              )
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Expected source pattern not found:\n{old}')
              text = text.replace(old, new, 1)

          path.write_text(text)

      - name: Verify callback shapes
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'onOpen = { item, occurrenceDate -> editorTarget = EditorTarget(item, occurrenceDate); showEditor = true }' app/src/main/java/com/pastelcal/app/MainActivity.kt
          grep -F 'onOpen: (CalendarItem, LocalDate) -> Unit' app/src/main/java/com/pastelcal/app/MainActivity.kt
          grep -F 'onOpen = { onOpen(occurrence.source, occurrence.date) }' app/src/main/java/com/pastelcal/app/MainActivity.kt

      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-task-callbacks.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix task occurrence open callbacks'
          git push origin HEAD:main
