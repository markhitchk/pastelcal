name: Fix PastelCal task compile issue

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-task-open-build.yml'

permissions:
  contents: write

jobs:
  fix-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fix task open callback
        shell: python
        run: |
          from pathlib import Path
          path = Path('app/src/main/java/com/pastelcal/app/MainActivity.kt')
          text = path.read_text()
          old = 'onOpen = { onOpen(occurrence.source, occurrence.date) }'
          new = 'onOpen = { onOpen(occurrence.source) }'
          if old not in text:
              raise SystemExit('Expected compile-error callback was not found')
          path.write_text(text.replace(old, new, 1))

      - name: Remove one-time workflow and commit fix
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-task-open-build.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix task open callback compile error'
          git push origin HEAD:main
