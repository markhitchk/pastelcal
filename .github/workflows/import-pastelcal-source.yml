name: Import PastelCal Source

on:
  pull_request:
    branches: [main]
    paths:
      - '.source-parts/pr-trigger'

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Recreate and validate source archive
        shell: bash
        run: |
          set -euo pipefail
          sha256sum .source-parts/part00 .source-parts/part01 .source-parts/part02 .source-parts/part03 .source-parts/part04
          cat .source-parts/part00 .source-parts/part01 .source-parts/part02 .source-parts/part03 .source-parts/part04 | base64 --decode > /tmp/pastelcal-source.tar.gz
          sha256sum /tmp/pastelcal-source.tar.gz
          gzip -t /tmp/pastelcal-source.tar.gz
          tar -tzf /tmp/pastelcal-source.tar.gz | grep -E '(^|/)settings.gradle.kts$|(^|/)app/build.gradle.kts$|MainActivity.kt$' >/dev/null

      - name: Unpack PastelCal Android source
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf /tmp/pastelcal-source.tar.gz -C .
          rm -rf .source-parts
          rm -f .github/workflows/import-pastelcal-source.yml

      - name: Commit source to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add PastelCal Android source code'
          git push origin HEAD:main
