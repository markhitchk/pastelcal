name: Apply Emma Author Note

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch-emma-author-note.py'
      - '.github/workflows/patch-emma-author-note.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-note:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Add author note and bump release
        run: python3 scripts/patch-emma-author-note.py

      - name: Commit source update
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No author-note changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/pastelcal/app/MainActivity.kt app/build.gradle.kts .github/workflows/build-apk.yml
          git commit -m 'Add Emma author note and release 1.1.2'
          git push origin HEAD:main
