name: Patch Period Tracker Navigation

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch-period-tracker-nav.py'
      - '.github/workflows/patch-period-tracker.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-navigation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Patch MainActivity navigation
        run: python3 scripts/patch-period-tracker-nav.py

      - name: Commit source update
        shell: bash
        run: |
          if git diff --quiet -- app/src/main/java/com/pastelcal/app/MainActivity.kt; then
            echo 'No navigation changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/pastelcal/app/MainActivity.kt
          git commit -m 'Add Period Tracker tab and screen navigation'
          git push origin HEAD:main
